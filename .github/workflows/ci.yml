name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Typecheck, then a production build into the runner's dist/ (not kept).
      - run: pnpm build
      # The runner has no GPU, and the page loads too slowly under software WebGL for the
      # e2e test, so it is skipped here (no Chrome); run it locally on a GPU.
      - run: pnpm test
        env:
          CHROME_PATH: /nonexistent
